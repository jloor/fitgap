openapi: 3.1.0

info:
  title: Crosswalk API
  version: 0.1.0
  summary: Find the gap between the work you've done and the work you want — then stage the projects that close it.
  description: |
    **Crosswalk** maps a person's evidenced capabilities against a role they want, identifies the gaps,
    and stages concrete projects to close them.

    Most job-matching tools score a résumé against a posting and return a percentage. Crosswalk is built
    on a different premise: **a "gap" is not one thing.** Some gaps are real capability gaps. Some are
    adjacent experience that needs honest reframing. And some — often the most valuable — are capabilities
    the person genuinely holds that their record simply doesn't say out loud.

    Those three cases need completely different responses, and conflating them is why résumé scoring is
    close to useless.

    ## The loop

    ```
    Target ──▶ Analysis ──▶ Gap ──▶ Project ──▶ Evidence ──▶ Inventory
                  ▲                                              │
                  └──────────────── re-analyze ◀─────────────────┘
    ```

    A **Target** is a role someone wants. **Inventory** is what they can evidence. An **Analysis** produces
    **Gaps**. A blocker gap suggests a **Project**; completing one produces **Evidence**, which promotes an
    **Inventory** entry, which changes the next Analysis. The loop closes.

    ## Gates run before analysis, and they halt it

    Before any gap analysis happens, a Target is evaluated against the user's **Filters** — non-negotiable
    constraints like location, working hours, or a required compensation range. A Target that fails a hard
    filter does not get analyzed. This is deliberate: analysis is expensive and tailoring effort is
    unrecoverable, so a role that can't be accepted should never consume either.

    See `POST /targets/{targetId}/analyses`, which returns `409` when gates have not passed.

    ## Excavation

    When Crosswalk suspects an **unarticulated** gap — the requirement looks unmet, but the person's
    history suggests otherwise — it returns *questions* rather than a verdict. Answering them can resolve
    the gap and write a new Inventory entry without any new work being done.

    This is the highest-value path in the API, because the cheapest gap to close is one that was never
    real.

  contact:
    name: Crosswalk
    email: api@example.com
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://api.crosswalk.example/v1
    description: Production
  - url: https://sandbox.api.crosswalk.example/v1
    description: Sandbox — seeded fixtures, no persistence

security:
  - bearerAuth: []

tags:
  - name: Filters
    description: Non-negotiable constraints, evaluated as gates before any analysis runs.
  - name: Inventory
    description: The evidenced capability record. The source of truth an analysis reads from.
  - name: Targets
    description: Roles the user is considering. Created from a URL or pasted text.
  - name: Analyses
    description: A single gap-analysis run of one Target against current Inventory.
  - name: Gaps
    description: An individual delta between a Target requirement and the Inventory — typed, not scored.
  - name: Projects
    description: Staged work that closes a gap and produces evidence.

paths:
  /filters:
    get:
      operationId: getFilters
      tags: [Filters]
      summary: Get the user's gate filters
      responses:
        '200':
          description: Current filters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilterSet' }
    put:
      operationId: replaceFilters
      tags: [Filters]
      summary: Replace the user's gate filters
      description: |
        Filters are evaluated against every new Target. A `hard` filter that fails blocks analysis;
        a `soft` filter that fails is recorded as a flag and analysis proceeds.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FilterSet' }
      responses:
        '200':
          description: Filters replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilterSet' }

  /inventory:
    get:
      operationId: listInventory
      tags: [Inventory]
      summary: List inventory entries
      parameters:
        - name: confidence
          in: query
          description: Filter by confidence level.
          schema: { $ref: '#/components/schemas/Confidence' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of inventory entries.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InventoryEntry' }
                  nextCursor: { type: [string, 'null'] }
    post:
      operationId: createInventoryEntry
      tags: [Inventory]
      summary: Record an evidenced capability
      description: |
        Entries should record what can be *evidenced*, not what the person feels able to do.
        `confidence: confirmed` asserts there is a concrete, checkable basis for the claim.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryEntryCreate' }
            examples:
              imaging:
                summary: A capability recovered by excavation
                value:
                  capability: PACS / DICOM imaging interfaces
                  confidence: confirmed
                  detail: Built HL7 interfaces to PACS and DICOM systems — Merge and Sectra (radiology/orthopaedic), Zeiss and Optos (ophthalmic).
                  sourceRole: Senior Data Integration Specialist
                  tags: [healthcare, integration, hl7, dicom]
      responses:
        '201':
          description: Entry created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryEntry' }

  /inventory/{entryId}:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    get:
      operationId: getInventoryEntry
      tags: [Inventory]
      summary: Get an inventory entry
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryEntry' }
        '404': { $ref: '#/components/responses/NotFound' }

  /targets:
    get:
      operationId: listTargets
      tags: [Targets]
      summary: List targets
      parameters:
        - name: gateStatus
          in: query
          schema: { $ref: '#/components/schemas/GateStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of targets.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Target' }
                  nextCursor: { type: [string, 'null'] }
    post:
      operationId: createTarget
      tags: [Targets]
      summary: Create a target from a posting
      description: |
        Supply either `sourceUrl` or `sourceText`. Crosswalk parses the posting into structured
        `requirements` and immediately evaluates it against the user's Filters.

        **The gate result is returned on creation.** If `gateStatus` is `failed`, analysis is blocked
        until the failure is explicitly overridden — see `POST /targets/{targetId}/analyses`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TargetCreate' }
            examples:
              pastedText:
                summary: Paste a job description
                value:
                  title: Enterprise Support Engineer
                  organization: Example Corp
                  sourceText: "We're seeking a seasoned Enterprise Support Engineer with deep API expertise…"
      responses:
        '201':
          description: Target created and gated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Target' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /targets/{targetId}:
    parameters:
      - $ref: '#/components/parameters/TargetId'
    get:
      operationId: getTarget
      tags: [Targets]
      summary: Get a target
      responses:
        '200':
          description: The target.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Target' }
        '404': { $ref: '#/components/responses/NotFound' }

  /targets/{targetId}/analyses:
    parameters:
      - $ref: '#/components/parameters/TargetId'
    post:
      operationId: createAnalysis
      tags: [Analyses]
      summary: Run a gap analysis
      description: |
        Compares the Target's parsed requirements against current Inventory and produces typed Gaps.

        Returns `409 Conflict` if the Target's `gateStatus` is `failed`. This is intentional — a role
        that fails a hard filter should not consume analysis or tailoring effort. Set
        `overrideGate: true` to proceed anyway; the override is recorded on the Analysis.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                overrideGate:
                  type: boolean
                  default: false
                  description: Proceed despite a failed hard filter. Recorded for audit.
                overrideReason:
                  type: string
                  description: Required when `overrideGate` is true.
      responses:
        '201':
          description: Analysis complete.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Analysis' }
        '409':
          description: Blocked by a failed hard filter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: gate_failed
                message: "Target failed 1 hard filter and was not analyzed."
                details:
                  failed: [{ filterId: flt_remote, reason: "On-site 5 days; user requires remote or ≤45min commute." }]

  /analyses/{analysisId}:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    get:
      operationId: getAnalysis
      tags: [Analyses]
      summary: Get an analysis
      responses:
        '200':
          description: The analysis.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Analysis' }
        '404': { $ref: '#/components/responses/NotFound' }

  /analyses/{analysisId}/gaps:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    get:
      operationId: listGaps
      tags: [Gaps]
      summary: List the gaps from an analysis
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/GapType' }
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/Severity' }
      responses:
        '200':
          description: The gaps.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Gap' }

  /gaps/{gapId}:
    parameters:
      - $ref: '#/components/parameters/GapId'
    get:
      operationId: getGap
      tags: [Gaps]
      summary: Get a gap
      responses:
        '200':
          description: The gap.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gap' }
        '404': { $ref: '#/components/responses/NotFound' }

  /gaps/{gapId}/excavations:
    parameters:
      - $ref: '#/components/parameters/GapId'
    post:
      operationId: submitExcavation
      tags: [Gaps]
      summary: Answer excavation questions
      description: |
        For gaps typed `unarticulated`, Crosswalk returns targeted questions instead of a verdict.
        Submitting answers can **resolve the gap without any new work being done** — and, when the answer
        establishes a real capability, writes a new Inventory entry.

        This is the cheapest possible way to close a gap, because the gap was never real. It exists in the
        record, not the person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [questionId, answer]
                    properties:
                      questionId: { type: string }
                      answer: { type: string }
            examples:
              recovered:
                summary: An answer that resolves the gap
                value:
                  answers:
                    - questionId: qst_01
                      answer: "I worked with PACS and DICOM at Nextech as an HL7 Engineer — Merge, Sectra, Zeiss, Optos."
      responses:
        '200':
          description: Excavation processed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  gap: { $ref: '#/components/schemas/Gap' }
                  resolved:
                    type: boolean
                    description: True if the gap is now closed.
                  inventoryEntryCreated:
                    type: [string, 'null']
                    description: ID of an Inventory entry written from the answers, if any.

  /gaps/{gapId}/projects:
    parameters:
      - $ref: '#/components/parameters/GapId'
    get:
      operationId: suggestProjects
      tags: [Projects]
      summary: Suggest projects that would close this gap
      description: |
        Returns candidate projects sized to produce **checkable evidence**, not study plans. A project
        whose output cannot be linked to, demonstrated, or verified does not close a gap in practice —
        it only changes how the person feels about it.
      responses:
        '200':
          description: Suggested projects.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectSuggestion' }

  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List staged projects
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProjectStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of projects.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
                  nextCursor: { type: [string, 'null'] }
    post:
      operationId: createProject
      tags: [Projects]
      summary: Stage a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: Project staged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      tags: [Projects]
      summary: Get a project
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateProject
      tags: [Projects]
      summary: Update a project's status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: '#/components/schemas/ProjectStatus' }
                notes: { type: string }
      responses:
        '200':
          description: Project updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }

  /projects/{projectId}/evidence:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: attachEvidence
      tags: [Projects]
      summary: Attach evidence and promote inventory
      description: |
        Records the artifact a completed project produced and **promotes the linked Inventory entry's
        confidence**. This is what closes the loop: the next Analysis of any Target reads the improved
        Inventory, and the gap that motivated the project no longer appears.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceCreate' }
            examples:
              repo:
                summary: A public repository
                value:
                  kind: repository
                  url: https://github.com/example/agent-eval-harness
                  summary: Multi-step agent workflow with schema-validated outputs and an eval harness.
      responses:
        '201':
          description: Evidence attached; inventory promoted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  evidence: { $ref: '#/components/schemas/Evidence' }
                  inventoryEntry: { $ref: '#/components/schemas/InventoryEntry' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "A Crosswalk API key, sent as `Authorization: Bearer <key>`."

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, examples: [inv_7Kd2] }
    TargetId:
      name: targetId
      in: path
      required: true
      schema: { type: string, examples: [tgt_91aF] }
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema: { type: string, examples: [ana_04Bq] }
    GapId:
      name: gapId
      in: path
      required: true
      schema: { type: string, examples: [gap_3Xz8] }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, examples: [prj_5Nm1] }

  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: The posting could not be parsed into requirements.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Confidence:
      type: string
      description: |
        How well a capability is evidenced.
          * `confirmed` — concrete, checkable basis.
          * `partial` — adjacent or dated; honest to mention, not to lead with.
          * `absent` — not held.
      enum: [confirmed, partial, absent]

    RequirementBar:
      type: string
      description: |
        **How a requirement is phrased changes whether it is a blocker.** "Familiarity with Python" and
        "proficient in Python" are different requirements wearing the same keyword, and treating them
        alike is the most common failure in résumé matching.
      enum: [exposure, familiarity, experience, proficient, expert]

    GapType:
      type: string
      description: |
        The three cases that require different responses.
          * `blocker` — genuinely not held. Close it with a project, or don't pursue the target.
          * `partial` — adjacent experience. Reframe honestly; never inflate.
          * `unarticulated` — **held, but the record doesn't say so.** Resolve by excavation, not work.
      enum: [blocker, partial, unarticulated]

    Severity:
      type: string
      enum: [critical, major, minor]

    GateStatus:
      type: string
      enum: [passed, failed, unknown]

    ProjectStatus:
      type: string
      enum: [suggested, staged, in_progress, complete, abandoned]

    FilterSet:
      type: object
      required: [filters]
      properties:
        filters:
          type: array
          items:
            type: object
            required: [id, label, kind, rule]
            properties:
              id: { type: string, examples: [flt_remote] }
              label: { type: string, examples: ["Remote, or commute ≤ 45 minutes"] }
              kind:
                type: string
                description: A failed `hard` filter blocks analysis. A failed `soft` filter is flagged only.
                enum: [hard, soft]
              rule:
                type: string
                description: Natural-language constraint evaluated against the parsed posting.
                examples: ["Role must be remote, or on-site within 45 minutes of New York, NY."]

    InventoryEntry:
      allOf:
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, examples: [inv_7Kd2] }
            createdAt: { type: string, format: date-time }
            evidenceIds:
              type: array
              items: { type: string }
        - $ref: '#/components/schemas/InventoryEntryCreate'

    InventoryEntryCreate:
      type: object
      required: [capability, confidence]
      properties:
        capability: { type: string, examples: ["PACS / DICOM imaging interfaces"] }
        confidence: { $ref: '#/components/schemas/Confidence' }
        detail:
          type: string
          description: The specific, checkable basis for the claim. Vague detail is why gaps get mis-typed.
        sourceRole: { type: string }
        tags:
          type: array
          items: { type: string }

    Target:
      type: object
      required: [id, title, gateStatus, createdAt]
      properties:
        id: { type: string, examples: [tgt_91aF] }
        title: { type: string }
        organization: { type: [string, 'null'] }
        sourceUrl: { type: [string, 'null'], format: uri }
        createdAt: { type: string, format: date-time }
        gateStatus: { $ref: '#/components/schemas/GateStatus' }
        gateResults:
          type: array
          description: One result per evaluated filter. Present even when all pass.
          items:
            type: object
            properties:
              filterId: { type: string }
              passed: { type: boolean }
              reason: { type: string }
        requirements:
          type: array
          items:
            type: object
            required: [id, text, bar]
            properties:
              id: { type: string }
              text: { type: string }
              bar: { $ref: '#/components/schemas/RequirementBar' }
              required:
                type: boolean
                description: Whether the posting lists this as required rather than preferred.

    TargetCreate:
      type: object
      properties:
        title: { type: string }
        organization: { type: string }
        sourceUrl: { type: string, format: uri }
        sourceText: { type: string }
      anyOf:
        - required: [sourceUrl]
        - required: [sourceText]

    Analysis:
      type: object
      required: [id, targetId, createdAt, gapCount]
      properties:
        id: { type: string, examples: [ana_04Bq] }
        targetId: { type: string }
        createdAt: { type: string, format: date-time }
        gateOverridden: { type: boolean, default: false }
        overrideReason: { type: [string, 'null'] }
        gapCount:
          type: object
          properties:
            blocker: { type: integer }
            partial: { type: integer }
            unarticulated: { type: integer }
        summary:
          type: string
          description: A plain statement of fit. Deliberately not a score.

    Gap:
      type: object
      required: [id, analysisId, requirementText, type, severity]
      properties:
        id: { type: string, examples: [gap_3Xz8] }
        analysisId: { type: string }
        requirementText: { type: string }
        bar: { $ref: '#/components/schemas/RequirementBar' }
        type: { $ref: '#/components/schemas/GapType' }
        severity: { $ref: '#/components/schemas/Severity' }
        rationale:
          type: string
          description: Why it was typed this way, in terms a person can argue with.
        excavationQuestions:
          type: array
          description: Present when `type` is `unarticulated`. Answer via `POST /gaps/{gapId}/excavations`.
          items:
            type: object
            properties:
              id: { type: string, examples: [qst_01] }
              question: { type: string }
        resolved: { type: boolean, default: false }

    ProjectSuggestion:
      type: object
      required: [title, rationale, evidenceKind, estimatedEffort]
      properties:
        title: { type: string }
        rationale: { type: string }
        evidenceKind: { $ref: '#/components/schemas/EvidenceKind' }
        estimatedEffort:
          type: string
          enum: [hours, days, weeks, months]

    Project:
      allOf:
        - type: object
          required: [id, status, createdAt]
          properties:
            id: { type: string, examples: [prj_5Nm1] }
            status: { $ref: '#/components/schemas/ProjectStatus' }
            createdAt: { type: string, format: date-time }
            evidenceIds:
              type: array
              items: { type: string }
        - $ref: '#/components/schemas/ProjectCreate'

    ProjectCreate:
      type: object
      required: [title, gapId]
      properties:
        title: { type: string }
        gapId: { type: string }
        inventoryEntryId:
          type: [string, 'null']
          description: The entry this project is intended to promote on completion.
        evidenceKind: { $ref: '#/components/schemas/EvidenceKind' }
        notes: { type: string }

    EvidenceKind:
      type: string
      description: What kind of checkable artifact the project produces.
      enum: [repository, deployed_artifact, publication, certification, credentialed_work, reference]

    Evidence:
      allOf:
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, examples: [evd_8Tp4] }
            createdAt: { type: string, format: date-time }
        - $ref: '#/components/schemas/EvidenceCreate'

    EvidenceCreate:
      type: object
      required: [kind, summary]
      properties:
        kind: { $ref: '#/components/schemas/EvidenceKind' }
        url: { type: [string, 'null'], format: uri }
        summary: { type: string }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [gate_failed] }
        message: { type: string }
        details: { type: object, additionalProperties: true }

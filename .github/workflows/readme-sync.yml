name: Sync docs to ReadMe

# Publishes the OpenAPI spec and the Markdown guides to ReadMe on every push to main.
#
# Verified against rdme v10.9.4 (2026-08-04).
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   README_API_KEY — from ReadMe: Configuration → API Key
#
# Both upload commands default to the `stable` branch of the ReadMe project.
# To target a different one, add `--branch=<name>` to the steps below.

on:
  push:
    branches: [main]
    paths:
      - 'openapi/**'
      - 'docs/**'
      - 'changelog/**'
      - 'mock/**'
      - '.github/workflows/readme-sync.yml'
  pull_request:
    paths:
      - 'openapi/**'
      - 'docs/**'
      - 'changelog/**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fail fast on a malformed spec — a bad definition should never reach ReadMe.
      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli@latest lint openapi/fitgap.yaml

      # The mock serves a committed copy of the spec (Vercel builds only see
      # files under mock/). This fails the build if the two ever diverge.
      - name: Check mock spec is in sync
        run: node mock/scripts/sync-spec.mjs --check

      # Dry runs surface frontmatter and slug problems without touching the project.
      - name: Dry-run spec upload
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          npx --yes rdme@latest openapi upload openapi/fitgap.yaml \
            --key="${{ secrets.README_API_KEY }}" \
            --slug=openapifitgap.yaml \
            --dry-run

      - name: Dry-run guides upload
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          npx --yes rdme@latest docs upload ./docs \
            --key="${{ secrets.README_API_KEY }}" \
            --dry-run

      - name: Dry-run changelog upload
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          npx --yes rdme@latest changelog upload ./changelog \
            --key="${{ secrets.README_API_KEY }}" \
            --dry-run

  publish:
    name: Publish to ReadMe
    needs: validate
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --confirm-overwrite is required in CI: without it the command prompts,
      # and a prompt in a runner is a hang, not a failure.
      #
      # --slug pins the target resource. Without it rdme INFERS the slug by
      # slugifying the whole relative path (`docs/api/petstore.json` becomes
      # `docs-api-petstore.json`), so renaming or MOVING the spec silently
      # creates a second API definition and orphans the first. That is exactly
      # what the Crosswalk → Fitgap rename did: it left a stale "Crosswalk API"
      # in the hub sidebar that no amount of pushing will remove. The orphan
      # must be deleted in the ReadMe dashboard — rdme v10 has no delete
      # command for API definitions.
      #
      # The value below is READ FROM CI LOGS, not derived from the docs, and
      # the difference is not academic. rdme's help says the slug is the
      # relative path slugified, giving `openapi-fitgap.yaml`. The actual live
      # resource is `openapifitgap.yaml` — the separator is STRIPPED, not
      # replaced with a hyphen. Publishing the documented-looking value created
      # a third API definition on 2026-08-05 (run 31011465734) rather than
      # updating the real one.
      #
      # Do not "correct" this to something that looks tidier or matches the
      # docs. Confirm any change against a real run first:
      #   gh run view <id> --log | grep 'successfully'
      # which prints the slug and says created vs updated. "created" on a spec
      # that already exists means the slug is wrong.
      #
      # With it pinned, the file may now be renamed or moved freely.
      - name: Upload OpenAPI definition
        run: |
          npx --yes rdme@latest openapi upload openapi/fitgap.yaml \
            --key="${{ secrets.README_API_KEY }}" \
            --slug=openapifitgap.yaml \
            --confirm-overwrite

      - name: Upload guides
        run: |
          npx --yes rdme@latest docs upload ./docs \
            --key="${{ secrets.README_API_KEY }}"

      - name: Upload changelog
        run: |
          npx --yes rdme@latest changelog upload ./changelog \
            --key="${{ secrets.README_API_KEY }}"
